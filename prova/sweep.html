<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:'Bodoni Moda';font-weight:400;src:url(font/bodoni.woff2) format('woff2');font-display:block}
@font-face{font-family:'Cormorant';font-weight:300;src:url(font/cormorant.woff2) format('woff2');font-display:block}
</style>
<script src="../cape-fold.js"></script>
<script>
/* Quanti anelli trova ogni lettera al variare di soglia e risoluzione.
   Il conteggio e' un segnale netto: una A deve fare 2 anelli, una M 1.
   Se non torna, la lettera si e' sfaldata, e non serve guardarla. */
(async function(){
  await document.fonts.load('300 200px Cormorant');
  await document.fonts.load('400 200px "Bodoni Moda"');
  await document.fonts.ready;
  const ATT_B = {V:1,O:2,I:1,D:2,A:2,N:1,M:1,R:2,K:1};
  const ATT_C = {A:2,R:2,T:1,'&':3,F:1,S:1,H:1,I:1,O:2,N:1};
  const out = [];
  for(const corpo of [340,440,560]){
    for(const soglia of [72,48,32,20]){
      capeFold.C.corpoTraccia = corpo;
      capeFold.C.sogliaAlfa = soglia;
      for(const k in capeFold._core) {}          /* niente */
      /* la cache e' per font+lettera: la svuoto cambiando il nome del font */
      const fb = '400 '+corpo+'px "Bodoni Moda"', fc = '300 '+corpo+'px Cormorant';
      let male = [];
      for(const ch in ATT_B){
        const n = capeFold._core.traccia(ch+'​'.repeat(0), fb+' /*'+soglia+'*/').anelli.length;
        if(n!==ATT_B[ch]) male.push('B:'+ch+'='+n+'/'+ATT_B[ch]);
      }
      for(const ch in ATT_C){
        const n = capeFold._core.traccia(ch,'Cormorant',300).anelli.length;
        if(n!==ATT_C[ch]) male.push('C:'+ch+'='+n+'/'+ATT_C[ch]);
      }
      out.push({corpo, soglia, sbagliate: male.length, male});
    }
  }
  window.__diag = out; window.__pronto = true;
})();
</script>
